[model params]
batch_size = 1
resize_to = 512
train_prop = 0.8

[version 2 params]
# Classifier settings
classifier_backbone = EfficientNetB3
classifier_threshold = 0.3
classifier_epochs = 10
classifier_lr = 1e-4

# Segmentation settings
seg_architecture = attention_unet_plus_plus
seg_depth = 3
use_attention = True
seg_epochs = 80
seg_lr = 3e-4

# Loss function (options: combined_dice_wpce, combined_dice_focal, focal_tversky)
loss_type = combined_dice_focal

# Inference settings
use_tta = True

# Beta pixel weighting (average % of PT pixels in training set)
beta_pixel_weighting = 0.010753784
